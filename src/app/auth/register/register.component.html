<div class="register-wrapper">
  <div class="card">
    <h2 class="title">Registro</h2>

    <!-- Selector igual al del login -->
    <div class="segmented">
      <button
        type="button"
        [class.active]="tipo === 'Usuario'"
        (click)="changeType('Usuario')"
      >
        Usuario
      </button>
      <button
        type="button"
        [class.active]="tipo === 'Empresa'"
        (click)="changeType('Empresa')"
      >
        Empresa
      </button>
    </div>

    <form (ngSubmit)="submit()" autocomplete="off">
      <!-- ========= USUARIO ========= -->
      <ng-container *ngIf="tipo === 'Usuario'">
        <div class="grid two">
          <div class="field">
            <input
              type="text"
              name="firstName"
              [(ngModel)]="user.firstName"
              required
              placeholder=" "
            />
            <label>Nombre</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="lastName"
              [(ngModel)]="user.lastName"
              placeholder=" "
            />
            <label>Apellido</label>
          </div>
        </div>

        <div class="grid one">
          <div class="field">
            <input
              type="email"
              name="email"
              [(ngModel)]="user.email"
              required
              placeholder=" "
            />
            <label>Email</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="password"
              name="password"
              [(ngModel)]="user.password"
              required
              placeholder=" "
            />
            <label>Contraseña</label>
          </div>
          <div class="field">
            <input
              type="password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder=" "
            />
            <label>Validar contraseña</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="date"
              name="dateOfBirth"
              [(ngModel)]="user.dateOfBirth"
              placeholder=" "
            />
            <label>Fecha de nacimiento</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="phoneNumber"
              [(ngModel)]="user.phoneNumber"
              placeholder=" "
            />
            <label>Teléfono</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="text"
              name="country"
              [(ngModel)]="user.country"
              placeholder=" "
            />
            <label>País</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="city"
              [(ngModel)]="user.city"
              placeholder=" "
            />
            <label>Ciudad</label>
          </div>
        </div>
      </ng-container>

      <!-- ========= EMPRESA ========= -->
      <ng-container *ngIf="tipo === 'Empresa'">
        <div class="grid one">
          <div class="field">
            <input
              type="text"
              name="razonSocial"
              [(ngModel)]="company.razonSocial"
              required
              placeholder=" "
            />
            <label>Razón social</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="text"
              name="nombreComercial"
              [(ngModel)]="company.nombreComercial"
              placeholder=" "
            />
            <label>Nombre comercial</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="nit"
              [(ngModel)]="company.nit"
              placeholder=" "
            />
            <label>NIT</label>
          </div>
        </div>

        <div class="grid one">
          <div class="field">
            <input
              type="email"
              name="companyEmail"
              [(ngModel)]="company.email"
              required
              placeholder=" "
            />
            <label>Email</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="password"
              name="companyPassword"
              [(ngModel)]="company.password"
              required
              placeholder=" "
            />
            <label>Contraseña</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="companyPhone"
              [(ngModel)]="company.telefono"
              placeholder=" "
            />
            <label>Teléfono</label>
          </div>
        </div>

        <div class="grid two">
          <div class="field">
            <input
              type="text"
              name="direccion"
              [(ngModel)]="company.direccion"
              placeholder=" "
            />
            <label>Dirección</label>
          </div>
          <div class="field">
            <input
              type="text"
              name="companyCity"
              [(ngModel)]="company.ciudad"
              placeholder=" "
            />
            <label>Ciudad</label>
          </div>
        </div>
      </ng-container>

      <button class="primary" type="submit" [disabled]="loading">
        {{ loading ? "Registrando..." : "Registrar" }}
      </button>
    </form>
  </div>
</div>
