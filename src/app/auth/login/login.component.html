<div class="auth">
  <!-- PANELES (mitad/mitad) -->
  <div class="panes">
    <!-- LOGIN (izquierda) -->
    <section class="panel panel--login">
      <div class="panel__inner">
        <h2>Iniciar Sesión</h2>

        <form (ngSubmit)="login()" autocomplete="off">
          <div class="field">
            <input
              class="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder=" "
            />
            <label>Email</label>
          </div>

          <div class="field">
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder=" "
            />
            <label>Contraseña</label>
          </div>

          <div class="segmented">
            <button
              type="button"
              [class.active]="loginType === 'Usuario'"
              (click)="setLoginType('Usuario')"
            >
              Soy Usuario
            </button>
            <button
              type="button"
              [class.active]="loginType === 'Empresa'"
              (click)="setLoginType('Empresa')"
            >
              Soy Empresa
            </button>
          </div>

          <button class="primary" type="submit">Iniciar sesión</button>

          <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

          <p class="muted">
            ¿No tienes una cuenta?
            <button type="button" class="link" (click)="showRegister()">
              Regístrate aquí
            </button>
          </p>
        </form>
      </div>
    </section>

    <!-- REGISTER (derecha) -->
    <section class="panel panel--register">
      <div class="panel__inner">
        <app-register></app-register>
        <p class="muted centered">
          ¿Ya tienes una cuenta?
          <button type="button" class="link" (click)="showLogin()">
            Inicia sesión aquí
          </button>
        </p>
      </div>
    </section>
  </div>

  <!-- TAPA INFORMATIVA (sin botones). Por defecto cubre la DERECHA (registro) -->
  <aside class="overlay" [class.move-left]="isRegistering">
    <div class="overlay__content">
      <img
        src="../../../assets/images/LogoCarro_blanco.png"
        alt=""
        class="overlay__logo"
      />
      <h3>¡Únete a nosotros!</h3>
      <p>
        Regístrate para obtener una cuenta y aprovechar todos nuestros
        servicios.
      </p>
    </div>
  </aside>
</div>
